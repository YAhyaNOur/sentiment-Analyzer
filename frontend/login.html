<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentAI — Connexion</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #080810;
            --surface: #0f0f1a;
            --surface2: #151525;
            --border: #1f1f35;
            --accent: #7c6af7;
            --accent2: #f76a8a;
            --accent3: #6af7c8;
            --text: #eeeef8;
            --muted: #6b6b90;
            --success: #6af7c8;
            --error: #f76a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cabinet Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent2);
            bottom: -100px;
            right: -100px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--accent3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.05);
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124, 106, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 106, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 20px;
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 8px 20px;
            margin-bottom: 20px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .logo-badge span {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
        }

        .logo h1 span {
            color: var(--accent);
        }

        .logo p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(124, 106, 247, 0.05),
                0 40px 80px rgba(0, 0, 0, 0.5);
        }

        /* Tabs */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            background: var(--bg);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab {
            padding: 11px;
            text-align: center;
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            letter-spacing: 0.3px;
        }

        .tab.active {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* Form */
        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-title {
            font-family: 'Clash Display', sans-serif;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .form-sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.12);
        }

        input::placeholder {
            color: var(--muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Role selector */
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role-btn {
            padding: 14px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--muted);
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .role-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 6px;
        }

        .role-btn.active {
            border-color: var(--accent);
            background: rgba(124, 106, 247, 0.08);
            color: var(--accent);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Clash Display', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 106, 247, 0.4);
        }

        .btn:hover::after {
            opacity: 1;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
        }

        .alert.success {
            background: rgba(106, 247, 200, 0.08);
            border: 1px solid rgba(106, 247, 200, 0.2);
            color: var(--success);
            display: block;
        }

        .alert.error {
            background: rgba(247, 106, 138, 0.08);
            border: 1px solid rgba(247, 106, 138, 0.2);
            color: var(--error);
            display: block;
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="wrapper">
        <div class="logo">
            <div class="logo-badge">
                <div class="logo-dot"></div>
                <span>Plateforme IA active</span>
            </div>
            <h1>Sentiment<span>AI</span></h1>
            <p>Analyse intelligente des avis e-commerce</p>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Connexion</button>
                <button class="tab" onclick="switchTab('register')">Inscription</button>
            </div>

            <!-- LOGIN -->
            <div class="form active" id="loginForm">
                <div class="form-title">Bon retour 👋</div>
                <div class="form-sub">Accède à ton espace</div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="email@exemple.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <button class="btn" id="loginBtn" onclick="login()">Se connecter</button>
                <div class="alert" id="loginAlert"></div>
            </div>

            <!-- REGISTER -->
            <div class="form" id="registerForm">
                <div class="form-title">Créer un compte</div>
                <div class="form-sub">Rejoins la plateforme</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Prénom</label>
                        <input type="text" id="regPrenom" placeholder="Ali">
                    </div>
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" id="regNom" placeholder="Ben Salem">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="email@exemple.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>Je suis</label>
                    <div class="role-grid">
                        <button class="role-btn active" id="roleClient" onclick="selectRole('ROLE_CLIENT')">
                            <span class="role-icon">🛒</span>
                            Client
                        </button>
                        <button class="role-btn" id="roleVendeur" onclick="selectRole('ROLE_VENDEUR')">
                            <span class="role-icon">🏪</span>
                            Vendeur
                        </button>
                    </div>
                </div>

                <button class="btn" id="registerBtn" onclick="register()">Créer mon compte</button>
                <div class="alert" id="registerAlert"></div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8082';
        let selectedRole = 'ROLE_CLIENT';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', (i === 0) === (tab === 'login'));
            });
            document.getElementById('loginForm').classList.toggle('active', tab === 'login');
            document.getElementById('registerForm').classList.toggle('active', tab === 'register');
        }

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('roleClient').classList.toggle('active', role === 'ROLE_CLIENT');
            document.getElementById('roleVendeur').classList.toggle('active', role === 'ROLE_VENDEUR');
        }

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'alert ' + type;
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showAlert('loginAlert', 'Remplis tous les champs.', 'error'); return; }

            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Connexion...';

            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('email', data.email);
                    showAlert('loginAlert', '✅ Connexion réussie !', 'success');
                    setTimeout(() => {
                        window.location.href = data.role === 'ROLE_VENDEUR'
                            ? 'dashboard-vendeur.html'
                            : 'dashboard-client.html';
                    }, 800);
                } else {
                    showAlert('loginAlert', data.message || 'Email ou mot de passe incorrect.', 'error');
                }
            } catch (e) {
                showAlert('loginAlert', '❌ Serveur inaccessible.', 'error');
            }
            btn.textContent = 'Se connecter';
        }

        async function register() {
            const prenom = document.getElementById('regPrenom').value.trim();
            const nom = document.getElementById('regNom').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!prenom || !nom || !email || !password) { showAlert('registerAlert', 'Remplis tous les champs.', 'error'); return; }

            const btn = document.getElementById('registerBtn');
            btn.textContent = 'Création...';

            try {
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prenom, nom, email, password, role: selectedRole })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('registerAlert', '✅ Compte créé ! Tu peux te connecter.', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showAlert('registerAlert', data.message || 'Erreur inscription.', 'error');
                }
            } catch (e) {
                showAlert('registerAlert', '❌ Serveur inaccessible.', 'error');
            }
            btn.textContent = 'Créer mon compte';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').classList.contains('active')) login();
                else register();
            }
        });
    </script>
</body>

</html>
